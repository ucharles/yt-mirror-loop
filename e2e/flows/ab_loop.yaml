# E-08
appId: com.pgmworks.ytmirrorloop
tags: [offline]
---
- runFlow: ../common/reset.yaml
- runFlow: ../common/import_counter.yaml
- runFlow:
    file: ../common/open_video.yaml
    env: { TITLE: counter_30fps_60s }
- runFlow:
    file: ../common/seek.yaml
    env: { T: 1, LABEL: "0:01.000" }
- tapOn: { id: btn-ab-a }
- runFlow:
    file: ../common/seek.yaml
    env: { T: 3, LABEL: "0:03.000" }
- tapOn: { id: btn-ab-b }
- tapOn: { id: btn-ab-toggle }
- assertVisible: { id: btn-ab-toggle, text: "loop:on" }
- assertVisible: { id: timeline-ab }
- runFlow:
    file: ../common/seek.yaml
    env: { T: 0.5, LABEL: "0:00.500" }
- tapOn: { id: btn-play }
- extendedWaitUntil:
    visible: { id: ab-loop-count, text: "(1[0-9]|[2-9][0-9])회" }
    timeout: 30000
- assertVisible: { id: e2e-state, text: playing }
- copyTextFrom: { id: e2e-stalls }
- assertTrue: ${Number(maestro.copiedText) == 0}
- tapOn: { id: btn-pause }
