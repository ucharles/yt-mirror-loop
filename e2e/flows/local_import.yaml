# E-02
appId: com.pgmworks.ytmirrorloop
tags: [offline]
---
- runFlow: ../common/reset.yaml
- runFlow:
    file: ../common/link.yaml
    env:
      URL: "ytmirror://e2e/import-fixture?name=counter_30fps_60s.mp4&slow=1"
- extendedWaitUntil:
    visible:
      id: import-progress
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: counter_30fps_60s
    timeout: 15000
- assertNotVisible:
    id: import-progress
- assertVisible:
    id: card-source-.*
    text: 파일
- assertVisible:
    id: card-duration-.*
    text: "1:00"
- assertVisible:
    id: card-segments-.*
    text: 구간 0
