<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mirror-decision-title mirror-decision-desc">
<title id="mirror-decision-title">반전은 어디서 판단하나</title>
<desc id="mirror-decision-desc">React Native는 구간과 전체 반전 설정만 엔진에 보내고, 유튜브는 WebView 안 JS가 매 프레임 시각을 보간해 CSS로, 로컬 영상은 Swift가 AVPlayer 경계 옵저버로 레이어를 뒤집으며, 결과는 화면 표시용 이벤트로만 돌아온다는 것을 보여 준다.</desc>
