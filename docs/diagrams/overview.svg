<desc id="overview-desc">유튜브 링크나 영상 파일이 플레이어로 들어가 지정 구간에서 좌우 반전되어 iPad(조작 화면)와 TV(반전 영상만)로 나가고, 구간 설정은 기기에 자동 저장되며 JSON 파일로 다른 iPad와 주고받는다는 것을 보여 준다.</desc>
