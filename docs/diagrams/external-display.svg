<title id="external-display-title">TV 연결 시 두 엔진의 차이</title>
<desc id="external-display-desc">로컬 영상은 AVPlayer 하나에 iPad 미리보기 레이어와 TV 레이어를 함께 붙여 자동으로 동기화되고, 유튜브는 앱 안 WebView를 내리고 TV 쪽 WebView 하나만 재생하도록 명령과 이벤트를 옮긴다는 차이를 보여 준다.</desc>
